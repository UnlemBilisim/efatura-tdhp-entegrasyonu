<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İzleme Paneli</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f7f9; --kart:#fff; --yazi:#1d2330; --soluk:#667085; --cizgi:#e2e5ea; --ana:#2f5bea;
          --ok:#12805c; --uyari:#a15c07; --hata:#b42318; --ok-bg:#e7f6ef; --uyari-bg:#fff4e0; --hata-bg:#fdecea; --kod:#f1f3f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --kart:#1d222b; --yazi:#e8ebf0; --soluk:#9aa4b2; --cizgi:#303744;
          --ana:#7a9bff; --ok:#4cc79a; --uyari:#f5b95a; --hata:#ff8a80; --ok-bg:#16322a; --uyari-bg:#3a2d14; --hata-bg:#3a1f1d; --kod:#262c37; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--yazi); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--cizgi); background:var(--kart); }
  h1 { font-size:17px; margin:0; } .soluk { color:var(--soluk); font-size:12px; }
  .ayar { display:flex; gap:14px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  select, button { font:inherit; padding:5px 9px; border:1px solid var(--cizgi); border-radius:7px; background:var(--kart); color:var(--yazi); }
  label.t { display:flex; gap:5px; align-items:center; cursor:pointer; }
  main { padding:16px 20px 60px; max-width:1300px; margin:0 auto; }
  #baglanti { padding:10px 14px; border-radius:8px; margin-bottom:12px; background:var(--hata-bg); color:var(--hata); display:none; font-weight:600; }
  .kartlar { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:10px 14px; }
  .kart b { display:block; font-size:22px; } .kart.hata b { color:var(--hata); } .kart.uyari b { color:var(--uyari); } .kart.ok b { color:var(--ok); }
  nav { display:flex; gap:4px; margin-bottom:10px; border-bottom:1px solid var(--cizgi); }
  nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 14px; cursor:pointer; color:var(--soluk); }
  nav button.aktif { color:var(--yazi); border-bottom-color:var(--ana); font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--cizgi); vertical-align:top; font-size:13px; }
  th { background:var(--kod); font-weight:600; position:sticky; top:0; }
  tr.satir { cursor:pointer; } tr.satir:hover { background:var(--kod); }
  td.mono, .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .durum { display:inline-block; min-width:38px; text-align:center; padding:1px 7px; border-radius:6px; font-weight:700; font-size:12px; }
  .d2 { background:var(--ok-bg); color:var(--ok); } .d4 { background:var(--uyari-bg); color:var(--uyari); } .d5 { background:var(--hata-bg); color:var(--hata); }
  .hata-metni { color:var(--hata); }
  .bos { padding:30px; text-align:center; color:var(--soluk); background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; }
  .detay td { background:var(--kod); } pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.45 ui-monospace,Menlo,monospace; }
  .is { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .cubuk { height:8px; background:var(--kod); border-radius:5px; overflow:hidden; margin:6px 0 8px; } .cubuk i { display:block; height:100%; background:var(--ana); }
  .sirket { display:grid; grid-template-columns:110px 90px 70px 1fr; gap:8px; padding:3px 0; font-size:13px; }
  .gizli { display:none; }
  a.dugme, button.dugme { display:inline-block; padding:4px 10px; border:1px solid var(--ana); border-radius:7px; color:var(--ana); background:none; text-decoration:none; cursor:pointer; font-size:12px; margin-right:6px; }
  a.dugme:hover, button.dugme:hover { background:var(--kod); }
  .panel { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .panel h3 { margin:0 0 8px; font-size:14px; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:3px 12px; font-size:13px; }
  .kv span:nth-child(odd) { color:var(--soluk); }
  .onizleme { max-height:380px; overflow:auto; background:var(--kod); border-radius:8px; padding:10px; }
  .rozet { display:inline-block; padding:0 7px; border-radius:6px; font-size:11px; font-weight:600; background:var(--kod); color:var(--soluk); margin-right:4px; }
  .geri { margin-bottom:10px; }
  /* Karar izi */
  .iz-aciklama { font-size:12px; color:var(--soluk); margin-bottom:10px; }
  .adim { border:1px solid var(--cizgi); border-left-width:5px; border-radius:8px; padding:9px 12px; margin-bottom:8px; background:var(--kart); }
  .adim.kv-kural { border-left-color:#2f5bea; } .adim.kv-llm { border-left-color:#9b4dca; } .adim.kv-rag { border-left-color:#0e9aa7; }
  .adim.kv-dogrulama { border-left-color:#d9822b; } .adim.kv-sistem { border-left-color:#8a94a6; } .adim.kv-kullanici { border-left-color:#12805c; }
  .adim-baslik { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .adim-no { display:inline-block; min-width:22px; text-align:center; border-radius:11px; background:var(--kod); font-size:12px; padding:0 6px; color:var(--soluk); }
  .rozet.kv-kural { background:#e3eafd; color:#2f5bea; } .rozet.kv-llm { background:#f1e4fa; color:#9b4dca; } .rozet.kv-rag { background:#dff4f6; color:#0e8791; }
  .rozet.kv-dogrulama { background:#fdebd9; color:#b8650f; } .rozet.kv-sistem { background:var(--kod); color:var(--soluk); } .rozet.kv-kullanici { background:var(--ok-bg); color:var(--ok); }
  .adim-sonuc { margin:4px 0 2px; font-weight:600; } .adim-neden { color:var(--yazi); margin:2px 0 4px; font-size:13px; }
  .adim details { margin:4px 0; } .adim details > summary { cursor:pointer; color:var(--ana); font-size:12px; }
  .adim details > pre, .adim .alt-adim { margin:4px 0 4px; background:var(--kod); border-radius:6px; padding:8px 10px; max-height:420px; overflow:auto; }
  .adim table { margin:4px 0; font-size:12px; } .adim table th { position:static; }
  .alt-adim { border-left:3px solid var(--cizgi); }
  .hata-satiri td { background:var(--hata-bg); }
</style>
</head>
<body>
<header>
  <h1>İzleme Paneli</h1>
  <span class="soluk" id="kaynak">—</span>
  <div class="ayar">
    <label class="t">Zaman <select id="pencere">
      <option value="15">son 15 dk</option><option value="60" selected>son 1 saat</option>
      <option value="360">son 6 saat</option><option value="1440">son 24 saat</option></select></label>
    <label class="t"><input type="checkbox" id="saglik"> sağlık kontrollerini göster</label>
    <label class="t"><input type="checkbox" id="yalnizHata"> yalnızca hatalar</label>
    <label class="t"><input type="checkbox" id="otomatik" checked> otomatik yenile (5 sn)</label>
    <button id="yenile">Yenile</button>
    <span class="soluk" id="guncel"></span>
  </div>
</header>
<main>
  <div id="baglanti"></div>
  <div class="kartlar" id="kartlar"></div>
  <nav id="sekmeler">
    <button data-s="istekler" class="aktif">İstekler</button>
    <button data-s="dosyalar">Gelen dosyalar</button>
    <button data-s="isler">Onboarding işleri</button>
    <button data-s="hatalar">Hata logları</button>
    <button data-s="ham">Ham log</button>
  </nav>
  <section id="istekler"></section>
  <section id="dosyalar" class="gizli"></section>
  <section id="isler" class="gizli"></section>
  <section id="hatalar" class="gizli"></section>
  <section id="ham" class="gizli"></section>
</main>
<script src="/panel.js"></script>
</body>
</html>
