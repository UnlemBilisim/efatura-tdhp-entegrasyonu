; Tek container içinde iki bağımsız uvicorn servisini yönetir.
; baslat.sh'teki komutlarla birebir aynı parametreler kullanılır
; (bkz. ../baslat.sh satır 64-65 ve 94).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; Her iki servis de --workers BELIRTMEDEN (tek worker) calisiyor - bilerek.
; --workers eklenirse es_zamanli_sinir.py'deki (hem burada hem
; Mcp_mimarisi/src/efatura_kdv/'de, ikiz modul) MAX_ESZAMANLI_ISLEM
; semaforu her worker'da AYRI olusur, gercek limit worker sayisiyla
; CARPILIR - o modulun docstring'ine bak once (2026-10-01).

[program:mcp_mimarisi]
directory=/app/Mcp_mimarisi
command=python3 -m uvicorn efatura_kdv.api:app --app-dir src --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
priority=10

[program:entegrasyon]
directory=/app/entegrasyon
command=python3 -m uvicorn app:app --host 0.0.0.0 --port 8100
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
priority=20
