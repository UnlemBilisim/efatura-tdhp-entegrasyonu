# Üç servisi tek komutla ayağa kaldırır: PostgreSQL, Ollama (RAG/embedding),
# ve ana uygulama (Mcp_mimarisi + entegrasyon, tek image — bkz. Dockerfile).
#
# SSH tünel (uzak GPU'daki LLM için) BU DOSYADA YOK — host/sunucu seviyesinde
# ayrı bir systemd servisi olarak kalır (bkz. mimari.md, uzak makineye
# gittiği için container içine alınamaz). "app" servisi bu tünele
# host.docker.internal üzerinden erişir (MODEL_EVAL_OLLAMA_HOST env var'ı).
#
# Kullanım:
#   POSTGRES_PASSWORD=<güçlü-parola> docker compose up -d
#
# POSTGRES_PASSWORD env var'ı ZORUNLUDUR — varsayılan bırakılmadı (bkz.
# docs/explanation/guvenlik-durumu-2026-07-27.md, gömülü parola düzeltmesi).
#
# --- SQL (PostgreSQL) ve vektör veritabanı (ChromaDB) verisi ---
# Bu dosyadaki "postgres" ve "ollama" servisleri sadece BOŞ, taze bir
# PostgreSQL/Ollama kurulumu sağlar — mevcut sistemin gerçek verisini
# (NACE tablosu, geçmiş fatura kalemleri, RAG embedding'leri) TAŞIMAZ.
# Bu veriler image içine hiç GİRMEZ (bilinçli — bkz. .gitignore/.dockerignore,
# gerçek şirket/fatura verisi barındırdıkları için registry'ye/git'e
# gömülmezler). Yeni bir sunucuda `docker compose up` sonrası mevcut veriyi
# geri yüklemek için ayrıca (scp/rsync ile) taşınması gerekir:
#   - PostgreSQL dump'ı → docs/how-to/docker-ile-calistirma.md §5
#   - ChromaDB (model_eval/vector_db/, "ollama" container'ının DEĞİL, "app"
#     container'ının kullandığı ayrı bir dizin) → aşağıdaki not
#
# NACE/KDV Excel aktarım kaynakları image'a gömülüdür. Şirkete özel
# mizan artık Excel'den değil PostgreSQL tenant şemasından okunur.

# Üç servis de `restart: unless-stopped` ile sürekli çalışır ve Docker'ın
# varsayılan `json-file` log sürücüsü rotasyonsuzdur (host modunda
# log_ortak.py::loglamayi_kur'un uyguladığı 10MB×5 limitin bir eşi burada
# yoktu) — sınırsız disk büyümesini önlemek için her serviste aynı limit
# (10MB×5 dosya) tanımlanır (2026-09-28, kullanıcı kararı — baslat.sh
# kullanımdan kalkıp sadece Docker ile çalıştırılacak).
x-log-rotasyonu: &log-rotasyonu
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: efatura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var tanımlı olmalı — güçlü bir parola verin}
      POSTGRES_DB: efatura_kdv
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - efatura-kdv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efatura"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *log-rotasyonu

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - efatura-ollama-data:/root/.ollama
    restart: unless-stopped
    logging: *log-rotasyonu

  app:
    # image: registry'de varsa doğrudan pull edilir (sunucuda kullanılan yol).
    # build: yerel değişiklik sonrası `docker compose build` ile bu image adına
    # yeniden build almak için (geliştirme makinesinde kullanılan yol) — ikisi
    # birlikte bulunabilir, Compose `up` sırasında build'i zorlamaz.
    image: docker.unlemcloud.com/unlembilisim/efatura-kdv-tdhp-sistemi:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://efatura:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var tanımlı olmalı}@postgres:5432/efatura_kdv
      OLLAMA_HOST: http://ollama:11434
      # Uzak GPU'daki LLM'e giden SSH tüneli host makinede systemd servisi
      # olarak çalışıyor — container'dan host'a bu şekilde erişilir.
      MODEL_EVAL_OLLAMA_HOST: http://host.docker.internal:11435
      # Dış API anahtarları veritabanında (api_anahtarlari tablosu) tutulur:
      #   docker compose exec app python3 /app/entegrasyon/api_anahtari_yonet.py
      MCP_INTERNAL_API_TOKEN: ${MCP_INTERNAL_API_TOKEN:?MCP_INTERNAL_API_TOKEN env var tanımlı olmalı}
      # İstek boyutu sınırı (entegrasyon/security.py) — varsayılan 10 MB,
      # dış ekip isteğiyle 30 MB'a yükseltildi (2026-09-30). .env'de yoksa
      # kod kendi varsayılanına (10 MB) düşer.
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-10485760}
    # ⚠️ 2026-09-30, kullanıcı kararı: dış ekibin gerçekten dışarıdan (kendi
    # makinelerinden) istek atabilmesi için 8100 tüm arayüzlere açıldı
    # (önceden 127.0.0.1 — sadece bu makineden erişilebiliyordu, dış ekibe
    # verilen 10.38.20.146:8100 adresi FİİLEN ÇALIŞMIYORDU, LAN IP'si bile
    # loopback bind yüzünden reddediliyordu — gerçek istekle doğrulandı).
    # API anahtarı auth'u (entegrasyon/auth.py) hâlâ zorunlu — bu değişiklik
    # sadece TCP seviyesinde kimin bağlanabileceğini genişletiyor, kimlik
    # doğrulamayı KALDIRMIYOR. Postgres (5434) ve Ollama (11434) portları
    # bilerek 127.0.0.1'de BIRAKILDI — dışarıya sadece 8100 açılıyor.
    #
    # ✅ Düzeltildi (2026-10-01, kullanıcı kararı — TODO.md "/fatura/
    # gecmis-kontrol keyfi VKN sorgusu"): 8000 (Mcp_mimarisi) yukarıdaki
    # 2026-09-30 değişikliğinde YANLIŞLIKLA 8100'le birlikte 0.0.0.0'a
    # açılmıştı — entegrasyon zaten Mcp_mimarisi'ye aynı container içinde
    # `http://localhost:8000` ile bağlanıyor (mcp_mimarisi_istemcisi.py),
    # bu çağrı host'un port eşlemesinden tamamen bağımsız. Dış ekibin
    # hiçbir belgesinde 8000'e dışarıdan erişim yok, hepsi 8100 kullanıyor.
    # 8000 dışarıya açık kalması `MCP_INTERNAL_API_TOKEN`'ı (VKN-bazlı
    # yetki kontrolü OLMAYAN tek bir dahili token) LAN'daki herkese
    # (dış ekip dahil, 8100 onlar için açıldığı için aynı ağdalar) maruz
    # bırakıyordu — bkz. docs/explanation/guvenlik-durumu-2026-07-27.md.
    # Şimdi 8000 de Postgres/Ollama gibi 127.0.0.1'e geri alındı.
    ports:
      - "127.0.0.1:8000:8000"
      - "8100:8100"
    volumes:
      # ChromaDB (RAG) verisi — rag_common.py::DEFAULT_PERSIST_DIR burayı
      # kullanır. Volume olmadan container her yeniden oluşturulduğunda
      # (image güncelleme, `down`+`up`) /fatura/onayla ile biriken RAG
      # kayıtları sessizce sıfırlanırdı.
      - efatura-vector-db:/app/model_eval/vector_db
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *log-rotasyonu

volumes:
  efatura-kdv-pgdata:
  efatura-ollama-data:
  efatura-vector-db:
