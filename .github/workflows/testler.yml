name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: efatura
          POSTGRES_PASSWORD: efatura
          POSTGRES_DB: model_eval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U efatura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Sadece CI'daki geçici test veritabanı — gerçek bir sır değildir.
      TEST_DATABASE_URL: postgresql://efatura:efatura@localhost:5432/model_eval_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # docker/Dockerfile ile aynı sürüm.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Mcp_mimarisi/requirements.txt
            entegrasyon/requirements.txt
            model_eval/requirements.txt
            model_eval/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: |
          pip install \
            -r Mcp_mimarisi/requirements.txt \
            -r entegrasyon/requirements.txt \
            -r model_eval/requirements-dev.txt

      - name: İkiz modüller birebir aynı mı
        # CLAUDE.md: bu iki modül iki serviste kopya olarak tutulur ve
        # birebir aynı kalmalıdır.
        run: |
          diff entegrasyon/log_ortak.py Mcp_mimarisi/src/efatura_kdv/log_ortak.py
          diff entegrasyon/es_zamanli_sinir.py Mcp_mimarisi/src/efatura_kdv/es_zamanli_sinir.py

      # Her bileşen kendi sys.path düzenini kurduğu için ayrı çalıştırılır.
      - name: Mcp_mimarisi testleri
        run: python -m pytest Mcp_mimarisi/test -q

      - name: entegrasyon testleri
        run: python -m pytest entegrasyon/tests -q

      - name: model_eval testleri
        working-directory: model_eval
        run: python -m pytest tests -q
